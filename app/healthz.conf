    # Railway health check (Railway rejects "-" in health check paths, so
    # /healthz aliases upstream's /api/sidecar-health: nginx + API sidecar).
    location = /healthz {
      proxy_pass http://127.0.0.1:${LOCAL_API_PORT}/api/sidecar-health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-WorldMonitor-Local-Token "${LOCAL_API_TOKEN}";
      proxy_read_timeout 10s;
    }
